name: Publish image

# A merged PR is a push to master, so `push` alone covers both cases
# without double-building (pull_request closed + push would fire twice per merge).
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (e.g. 1.2.3); leave empty to auto-increment"
        required: false
        default: ""

env:
  IMAGE: ghcr.io/${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine image tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          if [ -n "$TAG_INPUT" ]; then
            VERSION="$TAG_INPUT"
          else
            LAST=$(gh api "users/${{ github.repository_owner }}/packages/container/${{ github.event.repository.name }}/versions" \
              --paginate --jq '.[].metadata.container.tags[]?' 2>/dev/null \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
            LAST=${LAST:-0.0.0}
            VERSION=$(awk -F. -v OFS=. '{$3++; print}' <<<"$LAST")
          fi
          echo "Publishing ${IMAGE}:${VERSION}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
