---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - namespaces
  verbs:
  - create
  - delete
  - get
  - list
  - watch
- apiGroups:
  - '*'
  resources:
  - '*'
  verbs:
  - get
  - list
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - custom.jurikolo.name
  resources:
  - customconfigs
  - customdeployments
  - customnamespaces
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - custom.jurikolo.name
  resources:
  - customconfigs/finalizers
  - customdeployments/finalizers
  - customnamespaces/finalizers
  verbs:
  - update
- apiGroups:
  - custom.jurikolo.name
  resources:
  - customconfigs/status
  - customdeployments/status
  - customnamespaces/status
  verbs:
  - get
  - patch
  - update
